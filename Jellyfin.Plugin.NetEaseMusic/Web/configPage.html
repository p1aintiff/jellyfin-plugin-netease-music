<!DOCTYPE html>
<html>
<head>
    <title>NetEase Music</title>
    <style>
        #NetEaseMusicPage .nem-shell { max-width: 980px; margin: 0 auto; }
        #NetEaseMusicPage .nem-hero { position: relative; overflow: hidden; padding: 2.2em 2.4em; border-radius: 18px; background: linear-gradient(135deg, #3c235f, #7c3aed 55%, #db2777); color: #fff; box-shadow: 0 14px 35px rgba(56, 189, 248, .12); }
        #NetEaseMusicPage .nem-hero:after { content: ''; position: absolute; width: 220px; height: 220px; right: -70px; top: -90px; border-radius: 50%; background: rgba(255,255,255,.12); }
        #NetEaseMusicPage .nem-eyebrow { position: relative; z-index: 1; margin: 0 0 .45em; color: rgba(255,255,255,.78); font-size: .82em; letter-spacing: .12em; text-transform: uppercase; }
        #NetEaseMusicPage .nem-hero h1 { position: relative; z-index: 1; margin: 0; font-size: 2em; }
        #NetEaseMusicPage .nem-hero p { position: relative; z-index: 1; max-width: 620px; margin: .7em 0 0; color: rgba(255,255,255,.88); }
        #NetEaseMusicPage .nem-card { margin-top: 1.4em; padding: 1.6em; border: 1px solid rgba(255,255,255,.1); border-radius: 14px; background: rgba(30,30,35,.38); }
        #NetEaseMusicPage .nem-card h2 { margin-top: 0; }
        #NetEaseMusicPage .nem-form-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 1.2em; }
        #NetEaseMusicPage .nem-form-grid .nem-wide { grid-column: 1 / -1; }
        #NetEaseMusicPage .nem-options { display: flex; flex-wrap: wrap; gap: .7em 1.5em; margin: .5em 0 1.4em; }
        #NetEaseMusicPage .nem-option { display: flex; align-items: center; gap: .45em; }
        #NetEaseMusicPage .nem-submit { width: 100%; margin-top: .3em; }
        #NetEaseMusicPage .nem-progress { height: 8px; overflow: hidden; border-radius: 99px; }
        #NetEaseMusicPage .nem-status { margin: .8em 0 0; color: rgba(255,255,255,.75); }
        #NetEaseMusicPage .nem-result-summary { margin: 0; font-size: 1.1em; font-weight: 600; }
        #NetEaseMusicPage .nem-operation { color: rgba(255,255,255,.6); font-size: .85em; }
        #NetEaseMusicPage .nem-history-empty { padding: 1.4em; border: 1px dashed rgba(255,255,255,.2); border-radius: 10px; text-align: center; color: rgba(255,255,255,.62); }
        #NetEaseMusicPage .nem-history-row { display: flex; align-items: center; justify-content: space-between; gap: 1em; padding: 1em 0; border-bottom: 1px solid rgba(255,255,255,.1); }
        #NetEaseMusicPage .nem-history-row:last-child { border-bottom: 0; }
        #NetEaseMusicPage .nem-history-info { min-width: 0; flex: 1; }
        #NetEaseMusicPage .nem-history-name { margin-bottom: .3em; font-weight: 600; }
        #NetEaseMusicPage .nem-history-url { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: rgba(255,255,255,.62); font-size: .88em; }
        #NetEaseMusicPage .nem-history-actions { display: flex; flex-shrink: 0; gap: .5em; }
        #NetEaseMusicPage .nem-danger { --button-background: rgba(190, 55, 75, .18); }
        @media (max-width: 650px) { #NetEaseMusicPage .nem-hero { padding: 1.6em; } #NetEaseMusicPage .nem-form-grid { display: block; } #NetEaseMusicPage .nem-history-row { align-items: stretch; flex-direction: column; } #NetEaseMusicPage .nem-history-actions button { flex: 1; } }
    </style>
</head>
<body>
    <div id="NetEaseMusicPage" data-role="page" class="page type-interior pluginConfigurationPage">
        <div data-role="content">
            <div class="content-primary nem-shell">
                <section class="nem-hero">
                    <p class="nem-eyebrow">Jellyfin plugin · v0.2.2</p>
                    <h1>NetEase Music Importer</h1>
                    <p>Bring your favorite NetEase Cloud Music playlists into your Jellyfin library in a few clicks.</p>
                </section>
                <form id="NetEaseMusicImportForm">
                    <div class="verticalSection nem-card">
                        <h2>Import a playlist</h2>
                        <p>Paste a public NetEase playlist link to get started.</p>
                        <div class="nem-form-grid">
                        <div class="inputContainer nem-wide">
                            <input is="emby-input" id="playlistUrl" name="playlistUrl" type="url" required label="NetEase playlist URL" />
                        </div>
                        <div class="inputContainer">
                            <input is="emby-input" id="playlistName" name="playlistName" type="text" label="Jellyfin playlist name" />
                        </div>
                        </div>
                        <div class="nem-options">
                        <div class="checkboxContainer nem-option">
                            <label>
                                <input is="emby-checkbox" id="playlistPublic" type="checkbox" checked />
                                <span>Public playlist</span>
                            </label>
                        </div>
                        <div class="checkboxContainer nem-option">
                            <label>
                                <input is="emby-checkbox" id="saveCache" type="checkbox" checked />
                                <span>Save import history</span>
                            </label>
                        </div>
                        </div>
                        <button is="emby-button" type="submit" class="raised button-submit block nem-submit">
                            <span>Import playlist</span>
                        </button>
                    </div>
                </form>

                <div id="NetEaseMusicProgress" class="verticalSection nem-card hide">
                    <h2>Status</h2>
                    <progress id="importProgress" class="nem-progress" max="100" value="0" style="width:100%"></progress>
                    <p id="importStatus" class="nem-status"></p>
                </div>

                <div id="NetEaseMusicResult" class="verticalSection nem-card hide">
                    <h2>Result</h2>
                    <p id="importSummary" class="nem-result-summary"></p>
                    <p id="operationId" class="nem-operation"></p>
                    <div id="unmatchedSongs"></div>
                </div>

                <div id="NetEaseMusicImports" class="verticalSection nem-card">
                    <h2>Import history</h2>
                    <div id="importHistory"></div>
                </div>
            </div>
        </div>
        <script>
            (function () {
                var page = document.getElementById('NetEaseMusicPage');
                var form = page.querySelector('#NetEaseMusicImportForm');
                var progressSection = page.querySelector('#NetEaseMusicProgress');
                var progress = page.querySelector('#importProgress');
                var status = page.querySelector('#importStatus');
                var result = page.querySelector('#NetEaseMusicResult');
                var summary = page.querySelector('#importSummary');
                var operation = page.querySelector('#operationId');
                var unmatched = page.querySelector('#unmatchedSongs');
                var importHistory = page.querySelector('#importHistory');
                function asObject(response) {
                    if (response && response.responseJSON) {
                        return response.responseJSON;
                    }
                    if (response && response.responseText) {
                        return asObject(response.responseText);
                    }
                    if (response && response.Response) {
                        return asObject(response.Response);
                    }
                    if (response && response.response) {
                        return asObject(response.response);
                    }
                    if (typeof response === 'string') {
                        try {
                            return JSON.parse(response);
                        } catch (e) {
                            return {};
                        }
                    }
                    return response || {};
                }

                function pick(source, names) {
                    for (var i = 0; i < names.length; i++) {
                        if (source[names[i]] !== undefined && source[names[i]] !== null) {
                            return source[names[i]];
                        }
                    }
                    return null;
                }

                function hasImportFields(source) {
                    return source && (
                        pick(source, ['PlaylistName', 'playlistName']) !== null ||
                        pick(source, ['MatchedCount', 'matchedCount']) !== null ||
                        pick(source, ['TotalCount', 'totalCount']) !== null ||
                        pick(source, ['UnmatchedCount', 'unmatchedCount']) !== null
                    );
                }

                function importResultFrom(args) {
                    for (var i = 0; i < args.length; i++) {
                        var value = asObject(args[i]);
                        if (hasImportFields(value)) {
                            return value;
                        }
                    }
                    return asObject(args[0]);
                }

                function ajax(options) {
                    options.dataType = 'json';
                    return ApiClient.ajax(options).then(function () {
                        return importResultFrom(arguments);
                    });
                }

                function setProgress(value, text) {
                    progress.value = value;
                    status.textContent = text;
                    progressSection.classList.remove('hide');
                }

                function showResult(text, operationId, songs) {
                    summary.textContent = text;
                    operation.textContent = operationId ? 'OperationId: ' + operationId : '';
                    unmatched.innerHTML = '';

                    if (songs && songs.length) {
                        var title = document.createElement('h3');
                        title.textContent = 'Unmatched songs';
                        unmatched.appendChild(title);

                        var list = document.createElement('ul');
                        songs.slice(0, 20).forEach(function (song) {
                            var item = document.createElement('li');
                            item.textContent = (song.Name || song.name || '') + ' - ' + (song.Artist || song.artist || '');
                            list.appendChild(item);
                        });
                        unmatched.appendChild(list);
                    }

                    result.classList.remove('hide');
                }

                function renderImports(items) {
                    importHistory.innerHTML = '';
                    if (!items || !items.length) {
                        var empty = document.createElement('div');
                        empty.className = 'nem-history-empty';
                        empty.textContent = 'No import history yet. Your saved imports will appear here.';
                        importHistory.appendChild(empty);
                        return;
                    }

                    items.forEach(function (item) {
                        var playlistId = item.JellyfinPlaylistId || item.jellyfinPlaylistId || '';
                        var neteaseUrl = item.NetEaseUrl || item.netEaseUrl || '';
                        var playlistName = item.PlaylistName || item.playlistName || 'Playlist not found';

                        var row = document.createElement('div');
                        row.className = 'nem-history-row';

                        var info = document.createElement('div');
                        info.className = 'nem-history-info';

                        var name = document.createElement('div');
                        name.textContent = playlistName;
                        name.className = 'nem-history-name';
                        info.appendChild(name);

                        var url = document.createElement('a');
                        url.href = neteaseUrl;
                        url.target = '_blank';
                        url.rel = 'noopener noreferrer';
                        url.textContent = neteaseUrl;
                        url.className = 'nem-history-url';
                        info.appendChild(url);

                        row.appendChild(info);

                        var actions = document.createElement('div');
                        actions.className = 'nem-history-actions';

                        var update = document.createElement('button');
                        update.setAttribute('is', 'emby-button');
                        update.className = 'raised';
                        update.type = 'button';
                        update.textContent = 'Update';
                        update.addEventListener('click', function () {
                            update.disabled = true;
                            setProgress(25, 'Fetching playlist');
                            ajax({
                                type: 'POST',
                                url: ApiClient.getUrl('NetEaseMusic/Imports/' + encodeURIComponent(playlistId) + '/Refresh')
                            }).then(function (importResult) {
                                setProgress(90, 'Syncing playlist');
                                showImportResult(importResult);
                                setProgress(100, 'Complete');
                            }).catch(function (error) {
                                showError(error);
                                setProgress(100, 'Failed');
                            }).finally(function () {
                                update.disabled = false;
                            });
                        });
                        actions.appendChild(update);

                        var remove = document.createElement('button');
                        remove.setAttribute('is', 'emby-button');
                        remove.className = 'raised nem-danger';
                        remove.type = 'button';
                        remove.textContent = 'Delete cache';
                        remove.addEventListener('click', function () {
                            remove.disabled = true;
                            ApiClient.ajax({
                                type: 'DELETE',
                                url: ApiClient.getUrl('NetEaseMusic/Imports/' + encodeURIComponent(playlistId))
                            }).then(loadImports).finally(function () {
                                remove.disabled = false;
                            });
                        });
                        actions.appendChild(remove);
                        row.appendChild(actions);

                        importHistory.appendChild(row);
                    });
                }

                function loadImports() {
                    ajax({
                        type: 'GET',
                        url: ApiClient.getUrl('NetEaseMusic/Imports')
                    }).then(renderImports).catch(function () {
                        importHistory.textContent = 'Failed to load import history.';
                    });
                }

                function showImportResult(importResult) {
                    var playlistName = pick(importResult, ['PlaylistName', 'playlistName']) || 'Imported playlist';
                    var matchedCount = pick(importResult, ['MatchedCount', 'matchedCount']) || 0;
                    var totalCount = pick(importResult, ['TotalCount', 'totalCount']) || 0;
                    var unmatchedCount = pick(importResult, ['UnmatchedCount', 'unmatchedCount']) || 0;
                    var operationId = pick(importResult, ['OperationId', 'operationId']);
                    var unmatchedSongs = pick(importResult, ['UnmatchedSongs', 'unmatchedSongs']) || [];
                    showResult(
                        playlistName + ': ' + matchedCount + '/' + totalCount + ' matched, ' + unmatchedCount + ' unmatched.',
                        operationId,
                        unmatchedSongs
                    );
                }

                function showError(error) {
                    var body = asObject(error && (error.responseJSON || error.responseText)) || {};
                    showResult(body.error || 'Import failed.', body.operationId, null);
                }

                form.addEventListener('submit', function (event) {
                    event.preventDefault();

                    var button = form.querySelector('button[type="submit"]');
                    var body = {
                        Url: page.querySelector('#playlistUrl').value,
                        PlaylistName: page.querySelector('#playlistName').value || null,
                        Public: page.querySelector('#playlistPublic').checked,
                        SaveCache: page.querySelector('#saveCache').checked
                    };

                    button.disabled = true;
                    result.classList.add('hide');
                    setProgress(25, 'Fetching playlist');
                    Dashboard.showLoadingMsg();

                    window.setTimeout(function () {
                        if (button.disabled) setProgress(65, 'Matching songs');
                    }, 800);

                    ajax({
                        type: 'POST',
                        url: ApiClient.getUrl('NetEaseMusic/Import'),
                        data: JSON.stringify(body),
                        contentType: 'application/json'
                    }).then(function (importResult) {
                        setProgress(90, 'Creating playlist');
                        showImportResult(importResult);
                        setProgress(100, 'Complete');
                        loadImports();
                    }).catch(function (error) {
                        showError(error);
                        setProgress(100, 'Failed');
                    }).finally(function () {
                        button.disabled = false;
                        Dashboard.hideLoadingMsg();
                    });
                });
                loadImports();
            })();
        </script>
    </div>
</body>
</html>
