name: Release plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate release version
        shell: pwsh
        run: |
          $project = [xml](Get-Content 'Jellyfin.Plugin.NetEaseMusic/Jellyfin.Plugin.NetEaseMusic.csproj')
          $version = $project.Project.PropertyGroup.Version
          $assemblyVersion = $project.Project.PropertyGroup.AssemblyVersion
          $info = Get-Content 'manifest-info.json' | ConvertFrom-Json
          $build = Get-Content 'build.yaml' -Raw
          if ($env:GITHUB_REF_TYPE -ne 'tag' -or $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Run this workflow from tag v$version."
          }
          if ($assemblyVersion -ne "$version.0" -or $project.Project.PropertyGroup.FileVersion -ne $assemblyVersion -or
              $build -notmatch "(?m)^version: `"$([regex]::Escape($assemblyVersion))`"\s*$" -or
              -not $info.changelog.PSObject.Properties[$assemblyVersion]) {
            throw 'Project version, build.yaml, and changelog must match.'
          }

      - name: Check published release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $releases = gh api --paginate --slurp "repos/$env:GITHUB_REPOSITORY/releases" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not list releases.' }
          $release = $releases | ForEach-Object { $_ } | Where-Object { $_.tag_name -eq $env:GITHUB_REF_NAME }
          if ($release.draft) { throw 'An unfinished draft exists; complete or delete it before retrying.' }
          "published=$([bool]$release)".ToLowerInvariant() >> $env:GITHUB_OUTPUT
          $previous = $releases | ForEach-Object { $_ } | Where-Object { -not $_.draft -and -not $_.prerelease } | Select-Object -First 1
          $manifestUrl = ($previous.assets | Where-Object name -eq 'manifest.json').browser_download_url
          "manifest_url=$manifestUrl" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v5
        if: steps.existing.outputs.published != 'true'
        with:
          dotnet-version: 8.x

      - name: Build
        if: steps.existing.outputs.published != 'true'
        run: dotnet build Jellyfin.Plugin.NetEaseMusic/Jellyfin.Plugin.NetEaseMusic.csproj -c Release

      - name: Package plugin
        if: steps.existing.outputs.published != 'true'
        shell: pwsh
        run: ./scripts/package-plugin.ps1

      - name: Prepare plugin repository
        if: steps.existing.outputs.published != 'true'
        env:
          PREVIOUS_MANIFEST_URL: ${{ steps.existing.outputs.manifest_url }}
        shell: pwsh
        run: ./scripts/build-plugin-repository.ps1 -Repository $env:GITHUB_REPOSITORY -Tag $env:GITHUB_REF_NAME -PreviousManifestUrl $env:PREVIOUS_MANIFEST_URL

      - name: Publish GitHub Release
        if: steps.existing.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $packages = (Get-ChildItem 'dist/*.zip').FullName
          gh release create $env:GITHUB_REF_NAME @packages 'site/manifest.json' --repo $env:GITHUB_REPOSITORY --verify-tag --draft --title "NetEase Music Importer $env:GITHUB_REF_NAME" --notes-file 'dist/release-notes.md'
          if ($LASTEXITCODE -ne 0) { throw 'Could not create release.' }
          gh release edit $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release.' }
